[binaries]
c = '$OHOS_NDK_ROOT/llvm/bin/clang'
cpp = '$OHOS_NDK_ROOT/llvm/bin/clang++'
ar = '$OHOS_NDK_ROOT/llvm/bin/llvm-ar'
strip = '$OHOS_NDK_ROOT/llvm/bin/llvm-strip'

[built-in options]
c_args = ['-fPIC', '--target=aarch64-linux-ohos', '--sysroot=$OHOS_NDK_ROOT/sysroot', '-D__MUSL__', '-DOHOS_PLATFORM']
c_link_args = ['--target=aarch64-linux-ohos', '--sysroot=$OHOS_NDK_ROOT/sysroot', '-Wl,-Bsymbolic', '-stdlib=libc++', '-lc++_shared']

[properties]
harmony_abi = 'arm64-v8a'

[host_machine]
system = 'harmony'
cpu_family = 'aarch64'
cpu = 'aarch64'
endian = 'little'
