[binaries]
c = 'clang'
cpp = 'clang++'
ar = 'ar'
strip = 'strip'

[built-in options]
c_args = ['-arch', 'arm64', '-arch', 'x86_64', '-isysroot', '/Applications/Xcode.app/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk']
c_link_args = ['-arch', 'arm64', '-arch', 'x86_64']

[host_machine]
system = 'darwin'
cpu_family = 'x86_64'  # 主要架构，实际是 universal
cpu = 'x86_64'
endian = 'little'