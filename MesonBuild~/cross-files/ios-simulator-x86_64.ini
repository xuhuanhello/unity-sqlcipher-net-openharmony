[binaries]
c = ['xcrun', '-sdk', 'iphonesimulator', 'clang']
cpp = ['xcrun', '-sdk', 'iphonesimulator', 'clang++']
ar = ['xcrun', '-sdk', 'iphonesimulator', 'ar']
strip = ['xcrun', '-sdk', 'iphonesimulator', 'strip']

[built-in options]
c_args = ['-arch', 'x86_64', '-mios-simulator-version-min=12.0']
c_link_args = ['-arch', 'x86_64', '-mios-simulator-version-min=12.0']

[host_machine]
system = 'darwin'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'

[properties]
ios_deployment_target = '12.0'
ios_sdk = 'iphonesimulator'