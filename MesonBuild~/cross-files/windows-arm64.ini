[binaries]
# LLVM-MinGW ARM64 工具链
c = 'aarch64-w64-mingw32-clang'
cpp = 'aarch64-w64-mingw32-clang++'
ar = 'aarch64-w64-mingw32-ar'
strip = 'aarch64-w64-mingw32-strip'
pkg-config = 'aarch64-w64-mingw32-pkg-config'

[built-in options]
# Note: -static-libgcc is for GCC, LLVM-MinGW uses different flags
c_args = []
c_link_args = ['-static']

[host_machine]
system = 'windows'
cpu_family = 'aarch64'
cpu = 'aarch64'
endian = 'little'