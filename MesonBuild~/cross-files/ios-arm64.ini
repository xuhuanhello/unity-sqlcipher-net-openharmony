[binaries]
c = ['xcrun', '-sdk', 'iphoneos', 'clang']
cpp = ['xcrun', '-sdk', 'iphoneos', 'clang++']
ar = ['xcrun', '-sdk', 'iphoneos', 'ar']
strip = ['xcrun', '-sdk', 'iphoneos', 'strip']

[built-in options]
c_args = ['-arch', 'arm64', '-miphoneos-version-min=12.0', '-fembed-bitcode']
c_link_args = ['-arch', 'arm64', '-miphoneos-version-min=12.0']

[host_machine]
system = 'darwin'
cpu_family = 'aarch64'
cpu = 'aarch64'
endian = 'little'

[properties]
ios_deployment_target = '12.0'
ios_sdk = 'iphoneos'